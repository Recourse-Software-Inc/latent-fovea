# Precomputes cloud layouts and adds them to the data branch: cluster maps (UMAP) for models
# loaded from Hugging Face, so they open clustered at once, and PCA layouts for the built-in
# models, so the Clusters/PCA toggle has both. Existing layouts are kept.
name: build-layouts
on:
  workflow_dispatch:
    inputs:
      models:
        description: Extra Hugging Face repos, space-separated (every model in web/verified.json is always included)
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install numpy==2.* umap-learn==0.5.*
      - name: Start from the data branch
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then git --work-tree=out checkout FETCH_HEAD -- . && git reset -q
          else echo "::warning::No data branch yet: building layouts only (run build-data for the built-in models)."; fi
          rm -rf out/.git
      - name: Build layouts
        env:
          MODELS: ${{ inputs.models }}
        run: |
          pca=""; for d in out/*/; do [ -f "$d/meta.json" ] && [ ! -f "$d/points.pca.f32" ] && pca="$pca $d"; done
          [ -n "$pca" ] && python tools/build_layouts.py --pca $pca
          python tools/build_layouts.py --out out --verified web/verified.json --hf $MODELS
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "latent-fovea bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Layouts from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
