# Deploys the viewer and every built model to Cloudflare Pages.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages: Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them the job skips instead of failing.
# The Pages project is named by the repository variable PAGES_PROJECT (default latent-fovea).
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [build-data, build-layouts]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.creds.outputs.ok == 'true'
        with:
          ref: main
      - name: Fetch the model data (data branch)
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p web/data
          if git fetch --depth 1 origin data 2>/dev/null; then git --work-tree=web/data checkout FETCH_HEAD -- . && git reset -q
          else echo "::error::No data branch: run the build-data workflow first."; exit 1; fi
          ls web/data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.creds.outputs.ok == 'true'
        with:
          python-version: "3.11"
      - name: Stage the site (files split to fit the 25 MiB limit)
        if: steps.creds.outputs.ok == 'true'
        run: python tools/stage_static.py site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Deploy with Wrangler
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT || 'latent-fovea' }}
        run: |
          npx --yes wrangler@4.151.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.151.0 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
