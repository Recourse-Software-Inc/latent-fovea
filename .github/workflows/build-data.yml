# Builds the model data set (downloads open weights from Hugging Face) and
# publishes it to the orphan `data` branch, which tools/get_data.sh fetches.
name: build-data
on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model keys from tools/build_data.py (added to or replacing those already on the data branch)
        default: gpt2,distilgpt2,mdlm
      projection:
        description: umap or pca
        default: umap
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install numpy==2.* umap-learn==0.5.*
      - name: PyTorch (only needed for checkpoints without safetensors)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Start from the models already built
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then git --work-tree=out checkout FETCH_HEAD -- . && git reset -q; fi
          rm -rf out/.git
          ls out
      - name: Build
        env:
          MODELS: ${{ inputs.models }}
          PROJECTION: ${{ inputs.projection }}
        run: |
          for m in $(echo "$MODELS" | tr ',' ' '); do
            # keep the folder's LICENSE, NOTICE and neuron book (built separately) across a rebuild
            mkdir -p "keep/$m"; cp -r "out/$m/LICENSE" "out/$m/NOTICE" "out/$m/neurons" "keep/$m/" 2>/dev/null || true
            rm -rf "out/$m"
            python tools/build_data.py --model "$m" --projection "$PROJECTION" --out "out/$m" --weights
            cp -r "keep/$m/"* "out/$m/" 2>/dev/null || true
            if [ -f "out/$m/neurons/meta.json" ]; then python -c "import json,sys; p=sys.argv[1]; m=json.load(open(p)); m['neuron_book']='neurons/meta.json'; json.dump(m,open(p,'w'),indent=2)" "out/$m/meta.json"; fi
          done
          python tools/build_data.py --registry out
      - name: Publish to the data branch
        env:
          MODELS: ${{ inputs.models }}
          PROJECTION: ${{ inputs.projection }}
        run: |
          cd out
          git init -q -b data
          git config user.name "latent-fovea bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f README.md ] || printf '# Latent Fovea data\n\nBuilt by .github/workflows/build-data.yml. Each folder carries its model licence (LICENSE) and what was changed (NOTICE); meta.json records the source.\n' > README.md
          git add -A
          git commit -q -m "Data: $MODELS ($PROJECTION) from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
